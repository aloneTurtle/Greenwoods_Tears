#textdomain wesnoth-Greenwoods_Tears

[scenario]
    id=04x_The_Turmoil
    name= _ "The Turmoil"
    map_file=04x_The_Turmoil.map
    turns=-1
    next_scenario=05_Crelanus_Legacy

    allow_new_game=no

    theme=Cutscene_Minimal

    {NORTHERN_SCHEDULE}

    {CONTINUOUS_SCENARIO_MUSIC elvish-theme.ogg underground.ogg}

    {GWT_TRACK {JOURNEY_04X_NEW} }

    # wmllint: validate-off
    [side]
        side=1
        {PLAYABLE}

        gold=0

        # wmllint: recognize Arwen
        {CHARACTER_STATS_ARWEN}
    [/side]
    # wmllint: validate-on

    # wmllint: skip-side
    {MP_SIDE 2 (
        {PLAYABLE}

        gold=0

        # wmllint: recognize Grunk
        {CHARACTER_STATS_GRUNK}
    )}

    # wmllint: validate-off
    [side]
        side=3
        {UNPLAYABLE}
        team_name=player
        user_team_name= _ "team_name^Elves"
        {FLAG_VARIANT wood-elvish}

        # wmllint: recognize Roldur
        {CHARACTER_STATS_ROLDUR}
        facing=sw

        [unit]
            # wmllint: recognize Dowel
            {CHARACTER_STATS_DOWEL}
            x,y=10,7
            facing=sw
        [/unit]
        [unit]
            # wmllint: recognize Helena
            {CHARACTER_STATS_HELENA}
            x,y=12,8
            facing=sw
        [/unit]
    [/side]
    # wmllint: validate-on

    {STARTING_VILLAGES_ALL 3}

    [event]
        name=prestart

#ifndef MULTIPLAYER
        {RECALL_GRUNK 8 11}
#endif

        # wmllint: recognize Ellrea
        {RECALL_ELLREA 8 10}

        {MODIFY_UNIT (side=1,2) facing ne}

        # Mystical illuminations
        [item]
            terrain=Wwt
            halo=halo/elven/nature-halo[1~8].png~O(0.2):250
        [/item]
    [/event]

    [event]
        name=start

        [message]
            speaker=narrator
            message= _ "Dowel escorted Arwen to the capital of Greenwood. After the High Lord’s absence, Greenwood had been under the guardianship of Lord Roldur of Lintanir, Arwen’s uncle."
            image=wesnoth-icon.png
        [/message]
        [message]
            speaker=Arwen
            message= _ "This garden hasn’t changed at all. Yes, it’s as if time had stood still since I last set foot here."
        [/message]
        [message]
            speaker=Dowel
            message= _ "That is most true, prince. You loved the natural surroundings and the spring that encircle this manor. We tried not to touch this place, but to leave it just as beautiful as you knew it... believing that one day you would return to our home."
        [/message]
        [message]
            speaker=Helena
            message= _ "And now you have returned. You answered our prayers and even saved the life of a cherished member of Greenwood. Ellrea, you owe our prince a deep debt of gratitude."
        [/message]
        [message]
            speaker=Ellrea
            message= _ "I... I just cannot believe he is our prince. I cannot believe that this heartless rogue is the son of Lady Tamar, who welcomed me in when I was an orphan... At the very least, I never felt from him the warmth I had received from her."
        [/message]
        [message]
            speaker=Dowel
            message= _ "How rude of you, Ellrea!"
        [/message]
        [message]
            speaker=Roldur
            message= _ "<i>Calm yourself!</i> She is very upset right now. She was still very young when she was with Arwen and his family. It’s no wonder she finds it hard to believe, right?"
        [/message]
        [message]
            speaker=Arwen
            message= _ "... I can understand how memories of the past can haunt the present. This is especially true when they are from one’s youth."
        [/message]
        [message]
            speaker=Roldur
            message= _ "Very well. Now, we shall council on the imminent threat. There is not a moment to spare in halting this undead invasion. For the sake of the souls of the fallen soldiers, we must reclaim our peace. However, before we get down to business — who let this orcs’ slave into our capital?"
        [/message]
        [message]
            speaker=Dowel
            message= _ "It’s me. He is an ally of Prince Arwen and has aided in defending the border."
        [/message]
        [message]
            speaker=Grunk
            message= _ "..."
        [/message]
        [message]
            speaker=Roldur
            # po: This is partially based on the setting of the Fate of a Princess campaign.
            # po: In fact, Greenwood is very close to these orcish cities.
            message= _ "Dowel, you are an excellent commander, but perhaps you have grown a little too old. Have you forgotten how many orcs have feasted on our blood over the years? Since time immemorial, orcish lairs have surrounded Greenwood. Lmarig, Prestim, Dorest... and so forth! Did you not fear that a goblin’s entry might hasten our doom?"
        [/message]
        [message]
            speaker=Grunk
            # wmllint: local spelling Pah
            message= _ "Pah! You seem to trouble yourself about some ridiculous things, even though you might become dinner for those corpses at any second. I am no slave to orcs, nor ever have been!"
        [/message]
        [message]
            speaker=Roldur
            message= _ "Then why not show more reverence for the fact that you’ve been granted access to this forest? You should be deeply grateful to be within our capital, which is far beyond your worth..."
        [/message]
        [message]
            speaker=Arwen
            message= _ "Grunk, don’t answer! Uncle, if this council is nothing but a mockery of my friend, then I’m leaving!"
        [/message]
        [message]
            speaker=Dowel
            message= _ "Prince!"
        [/message]
        [message]
            speaker=Arwen
            message= _ "I am not your prince! In the end, I didn’t need to return here to make certain. It’s just like this garden. Nothing had changed in Greenwood — neither the pride of my people nor their more arrogant and corrupt parts!"
        [/message]

        {MOVE_UNIT (id=Arwen) 2 13}

        {MODIFY_UNIT (side=1,2) facing sw}

        {DELAY 1000}

        [message]
            speaker=Roldur
            # po: He still refuses to apologize to Grunk.
            message= _ "... Forgive me for not considering your feelings. But now, please understand that we no longer have any time left. To overcome this threat, we need you, the rightful heir to Greenwood."
        [/message]
        [message]
            speaker=Arwen
            message= _ "..."
        [/message]

        {DELAY 1000}

        {MOVE_UNIT (id=Arwen) 7 11}

        {MODIFY_UNIT (side=1,2) facing ne}

        {DELAY 1000}

        [message]
            speaker=Arwen
            message= _ "I have a plan. If it works out, peace and quiet might return to Greenwood and the Far North... or it might not."
        [/message]

        {FADE_TO_BLACK}

        {DELAY 1000}

        [message]
            speaker=narrator
            message= _ "Arwen spoke of Mal Keshar, the lich he had encountered during the alliance with the orcs, and the strange messages he had delivered."
            image=wesnoth-icon.png
        [/message]

        {FADE_IN}

        {DELAY 1000}

        [message]
            speaker=Arwen
            message= _ "This is the greatest and only clue we have at present. I... plan to follow his words, make for the Silent Forest and the Mountains of Haag, and discover the face of the enemy."
        [/message]
        [message]
            speaker=Roldur
            message= _ "That’s insane! Arwen, you have always been as wise as my sister. Why can’t you see that lich is the very evil assaulting our homeland?!"
        [/message]
        [message]
            speaker=Arwen
            message= _ "He harbored no hostility against us. If he had unleashed his full strength upon us, we would no longer be alive. But he did not. He seemed somehow... different from other evils."
        [/message]
        [message]
            speaker=Helena
            message= _ "... If he is indeed the Malin Keshar of our lore, then there is no falsehood in his words."
        [/message]
        [message]
            speaker=Dowel
            message= _ "Druid, are you going to believe what the lich says, too?"
        [/message]
        [message]
            speaker=Helena
            message= _ "No. I just believe in Prince Arwen. And Ellrea, what do you think?"
        [/message]
        [message]
            speaker=Ellrea
            message= _ "I... still cannot put my trust in him. I have been through far too much over the past few days. However, if he is our prince and lord, I believe I should go with him..."
        [/message]
        [message]
            speaker=Helena
            message= _ "Good answer."
        [/message]

        {DELAY 500}

        [message]
            speaker=Roldur
            message= _ "It seems we have no choice but to agree to the prince’s plan. But we must not be confident. I shall return to Lintanir once and ask the High Council for reinforcements. Arwen, their aid should follow after you."
        [/message]
        [message]
            speaker=Arwen
            message= _ "Thank you, uncle."
        [/message]

        [endlevel]
            result=victory
            bonus=no
            {NEW_GOLD_CARRYOVER 100}
            carryover_report=no
            linger_mode=no
            replay_save=no
        [/endlevel]
    [/event]
[/scenario]
